<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人类图标注工具</title>
<style>
:root{--bg:#111318;--panel:#1a1e27;--panel2:#222734;--line:#343a4a;--text:#e6e9f0;--dim:#8a93a6;--red:#d64541;--black:#3b4a5a;--stripe:#9b59b6;--empty:#262c38;--accent:#58a6ff;--good:#3fb950;--warn:#d29922;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;padding:20px;}
header{text-align:center;padding:10px 0 4px;}
header h1{font-size:21px;letter-spacing:1px;}
header p{color:var(--dim);font-size:13px;margin-top:4px;}
.legend{display:flex;justify-content:center;gap:13px;flex-wrap:wrap;padding:10px 12px;margin:14px auto;max-width:900px;background:var(--panel);border:1px solid var(--line);border-radius:10px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;}
.swatch{width:17px;height:17px;border-radius:4px;border:1px solid var(--line);}
.swatch.s-red{background:var(--red);}.swatch.s-black{background:var(--black);}.swatch.s-stripe{background:repeating-linear-gradient(45deg,var(--stripe) 0 4px,#5b2f6b 4px 8px);}
.config{max-width:900px;margin:14px auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.config h2{font-size:15px;margin-bottom:10px;}
.config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;}
.config-item label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px;}
.config-item select{width:100%;padding:8px 10px;font-size:13px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;}
.bodygraph{max-width:820px;margin:18px auto 0;padding:10px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);grid-template-areas:". hd ." ". aj ." ". th ." ". gg wl" "sp sa em" ". rt .";gap:10px 12px;}
#center-head{grid-area:hd;}#center-ajna{grid-area:aj;}#center-throat{grid-area:th;}#center-g{grid-area:gg;}
#center-heart{grid-area:wl;align-self:end;}
#center-spleen{grid-area:sp;align-self:start;}
#center-sacral{grid-area:sa;align-self:start;margin-top:14px;}
#center-emotion{grid-area:em;align-self:start;}
#center-root{grid-area:rt;}
.center{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.center.defined{border-color:var(--stripe);box-shadow:0 0 0 1px rgba(155,89,182,.15);}
.center-header{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:6px;gap:6px;}
.center-header .nm{white-space:nowrap;}
.center-header .def-state{font-size:10px;font-weight:400;white-space:nowrap;border:1px solid var(--line);padding:1px 6px;border-radius:10px;color:var(--dim);}
.center-header .def-state.on{color:var(--good);border-color:var(--good);}
.gates{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.gate{min-width:33px;height:33px;padding:0 4px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;cursor:pointer;border:2px solid var(--empty);background:transparent;color:var(--dim);transition:all .12s;}
.gate:hover{transform:scale(1.1);}
.gate.red{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;}
.gate.black{background:var(--black);border-color:var(--black);color:#cdd3e0;font-weight:700;}
.gate.stripe{background:repeating-linear-gradient(45deg,var(--stripe) 0 5px,#5b2f6b 5px 10px);border-color:var(--stripe);color:#fff;font-weight:700;}
.channels{max-width:940px;margin:20px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;}
.channels h2{font-size:16px;margin-bottom:4px;}
.channels .sub{color:var(--dim);font-size:12px;margin-bottom:14px;}
.chanlist{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.chrow{display:grid;grid-template-columns:1.4fr 1.5fr 1.5fr 1fr;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13px;}
.chrow:last-child{border-bottom:none;}
.chrow.head{background:var(--panel2);font-weight:700;color:var(--dim);font-size:12px;}
.cchannel{font-weight:600;}
.cchannel small{color:var(--dim);font-weight:400;display:block;font-size:11px;}
.chalf{display:flex;align-items:center;gap:6px;}
.chip{min-width:28px;height:24px;padding:0 5px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--dim);}
.chip.red{background:var(--red);border-color:var(--red);color:#fff;}
.chip.black{background:var(--black);border-color:var(--black);color:#cdd3e0;}
.chip.stripe{background:repeating-linear-gradient(45deg,var(--stripe) 0 5px,#5b2f6b 5px 10px);border-color:var(--stripe);color:#fff;}
.ctcenter{color:var(--dim);font-size:11px;}
.cstatus{font-weight:700;text-align:center;border-radius:6px;padding:2px 6px;}
.cstatus.def{color:var(--good);background:rgba(63,185,80,.12);}
.cstatus.half{color:var(--warn);background:rgba(210,153,34,.12);}
.cstatus.none{color:var(--dim);}
.toolbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px auto 6px;max-width:940px;}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 18px;font-size:14px;cursor:pointer;transition:all .15s;}
button:hover{border-color:var(--accent);background:#2a3040;}
button.primary{background:var(--accent);color:#0b0e14;border-color:var(--accent);font-weight:600;}
button.primary:hover{background:#79b8ff;}
button.danger{border-color:var(--warn);color:var(--warn);}
.count-bar{text-align:center;color:var(--dim);font-size:13px;margin:10px auto;max-width:940px;}
.output{max-width:940px;margin:6px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;}
.output h2{font-size:16px;margin-bottom:10px;}
#report{width:100%;min-height:200px;background:#0d1017;color:#c8d1e0;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;resize:vertical;}
.copy-btn-wrap{text-align:center;margin-top:10px;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--good);color:#0b0e14;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;}
.toast.show{opacity:1;}
@media(max-width:620px){.bodygraph{grid-template-columns:1fr;grid-template-areas:"hd" "aj" "th" "wl" "gg" "sp" "em" "sa" "rt";}#center-sacral{margin-top:0;}.chrow{grid-template-columns:1fr 1fr 1fr;}}
</style>
</head>
<body>
<header>
  <h1>🕉 人类图标注工具</h1>
  <p>点闸门选色（无色→红→黑→条纹），中心和通道自动推导 → 拉到底生成报告</p>
</header>

<div class="config">
  <h2>⚙️ 基础配置</h2>
  <div class="config-grid">
    <div class="config-item"><label>类型 Type</label>
      <select id="cfg-type"><option value="">— 请选择 —</option><option>生产者</option><option>显化建设者</option><option>显化者</option><option>投射者</option><option>反映者</option></select>
    </div>
    <div class="config-item"><label>内在权威 Authority</label>
      <select id="cfg-authority"><option value="">— 请选择 —</option><option>情绪权威</option><option>荐骨权威</option><option>脾脏权威</option><option>心脏权威</option><option>自我投射权威</option><option>无内在权威</option></select>
    </div>
    <div class="config-item"><label>人生角色 Profile</label>
      <select id="cfg-profile"><option value="">— 请选择 —</option><option>1/3</option><option>1/4</option><option>2/4</option><option>2/5</option><option>3/5</option><option>3/6</option><option>4/6</option><option>4/1</option><option>5/1</option><option>5/2</option><option>6/2</option><option>6/3</option></select>
    </div>
    <div class="config-item"><label>定义 Definition</label>
      <select id="cfg-definition"><option value="">— 请选择 —</option><option>单分人</option><option>二分人</option><option>三分人</option><option>四分人</option><option>无定义</option></select>
    </div>
    <div class="config-item"><label>策略 Strategy</label>
      <select id="cfg-strategy"><option value="">— 请选择 —</option><option>等待回应</option><option>告知</option><option>等待被邀请</option><option>等待月亮周期</option></select>
    </div>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><span class="swatch"></span> 无色·未激活</div>
  <div class="legend-item"><span class="swatch s-red"></span> 红·潜意识</div>
  <div class="legend-item"><span class="swatch s-black"></span> 黑·意识</div>
  <div class="legend-item"><span class="swatch s-stripe"></span> 条纹·红黑相间(双重)</div>
</div>

<div class="bodygraph" id="bodygraph"></div>

<div class="count-bar">已着色闸门：<span id="gateCount">0</span> / 64　·　定义通道：<span id="defCount">0</span>　·　半通道：<span id="halfCount">0</span></div>

<div class="channels">
  <h2>🔗 通道对照表</h2>
  <div class="sub">由闸门颜色**自动生成**：两端都有色=定义通道，一端有色=半通道。你只需在上面点闸门选色，这里自动更新；对岸闸门用并列字段显示。</div>
  <div id="channelTable"></div>
</div>

<div class="toolbar">
  <button class="primary" onclick="generateReport()">📤 生成标注报告</button>
  <button onclick="downloadReport()">💾 下载.txt</button>
  <button class="danger" onclick="resetAll()">🗑 清空</button>
</div>

<div class="output">
  <h2>📋 标注报告</h2>
  <div id="report"></div>
  <div class="copy-btn-wrap"><button class="primary" onclick="copyReport()">📋 复制报告</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
const ALL_CHANNELS=[
  [1,8,"创作"],[2,14,"方向"],[3,60,"突变"],[4,63,"逻辑"],[5,15,"韵律"],[6,59,"亲密"],[7,31,"领袖"],[9,52,"专注"],[10,20,"觉醒"],[10,34,"探索"],[11,56,"好奇"],[12,22,"开放"],[13,33,"见证"],[16,48,"才华"],[17,62,"接纳"],[18,58,"完美"],[19,49,"敏感"],[20,34,"魅力"],[20,57,"直觉"],[21,45,"金钱"],[23,43,"洞见"],[24,61,"灵感"],[25,51,"自发"],[26,44,"投降"],[27,50,"保存"],[28,38,"挣扎"],[29,46,"发现"],[30,41,"渴望"],[32,54,"转化"],[34,57,"力量"],[35,36,"无常"],[37,40,"社群"],[39,55,"情绪化"],[42,53,"成熟"],[47,64,"抽象"],[10,57,"生存"]];
const GATE_CENTER={};
(function(){const m={'61,63,64':'head','47,24,4,11,17,43':'ajna','62,31,8,33,16,35,20,56,45,12,23':'throat','1,2,13,7,10,46,25,15':'g','21,26,51,40':'heart','6,37,22,36,49,30,55':'emotion','57,48,28,32,50,44,18':'spleen','3,42,9,5,14,29,34,27,59':'sacral','58,52,53,60,38,39,54,41,19':'root'};for(const s in m)s.split(',').forEach(g=>GATE_CENTER[g]=m[s]);})();
const CENTER_ORDER=['head','ajna','throat','g','spleen','sacral','heart','emotion','root'];
const centerName={head:'🧠 头脑',ajna:'🧿 逻辑(Ajna)',throat:'🎤 喉咙',g:'🧭 G',heart:'💛 意志力',emotion:'🌊 情绪',spleen:'🩺 直觉',sacral:'⚡ 荐骨',root:'🌱 根部'};
const plainName={head:'头脑',ajna:'逻辑(Ajna)',throat:'喉咙',g:'G',heart:'意志力(心脏)',emotion:'情绪',spleen:'直觉(脾脏)',sacral:'荐骨',root:'根部'};
const COLOR_ORDER=['none','red','black','stripe'];
const colorName={none:'无色',red:'红',black:'黑',stripe:'条纹'};
const gateColor={}; // gate# -> 'none'|'red'|'black'|'stripe'

function gatesIn(c){return Object.keys(GATE_CENTER).filter(g=>GATE_CENTER[g]===c);}
function channelColor(a,b){return {a:gateColor[String(a)]||'none', b:gateColor[String(b)]||'none'};}
function channelStatus(a,b){const c=channelColor(a,b);const na=c.a==='none',nb=c.b==='none';return (na&&nb)?'none':((na||nb)?'half':'def');}

function buildBody(){
  const host=document.getElementById('bodygraph');
  let html='';
  CENTER_ORDER.forEach(cd=>{
    const g=gatesIn(cd).sort((x,y)=>+x-+y).map(g=>'<div class="gate none" data-gate="'+g+'">'+g+'</div>').join('');
    html+='<div class="center" id="center-'+cd+'"><div class="center-header"><span class="nm">'+centerName[cd]+'</span><span class="def-state">开放</span></div><div class="gates">'+g+'</div></div>';
  });
  host.innerHTML=html;
}
function refreshBodies(){
  CENTER_ORDER.forEach(cd=>{
    const card=document.getElementById('center-'+cd);
    if(!card)return;
    card.querySelectorAll('.gate').forEach(g=>{
      const c=gateColor[g.dataset.gate]||'none';
      g.className='gate '+c;
    });
    const state=card.querySelector('.def-state');
    const d=centerIsDefined(cd);
    state.textContent=d?'✓ 定义':'开放';
    state.classList.toggle('on',d);
    card.classList.toggle('defined',d);
  });
}
function centerIsDefined(cd){
  const g=gatesIn(cd).map(String);
  return ALL_CHANNELS.some(([a,b])=>{
    if(!(g.includes(String(a))||g.includes(String(b))))return false;
    return (gateColor[String(a)]||'none')!=='none' && (gateColor[String(b)]||'none')!=='none';
  });
}
function buildTable(){
  const host=document.getElementById('channelTable');
  let rows='<div class="chrow head"><div>通道</div><div>本端闸门</div><div>对岸闸门</div><div>状态</div></div>';
  ALL_CHANNELS.forEach(([a,b,cn])=>{
    const ga=gatesIn(GATE_CENTER[String(a)]);
    const gb=gatesIn(GATE_CENTER[String(b)]);
    const ca=gateColor[String(a)]||'none', cb=gateColor[String(b)]||'none';
    const st=channelStatus(a,b);
    const stTxt={def:'定义通道',half:'半通道',none:'未定义'}[st];
    const stCls={def:'def',half:'half',none:'none'}[st];
    rows+='<div class="chrow"><div class="cchannel">'+a+'-'+b+'<small>'+cn+'</small></div>'
      +'<div class="chalf"><span class="chip '+ca+'">'+a+'</span><span class="ctcenter">'+plainName[GATE_CENTER[String(a)]]+'</span></div>'
      +'<div class="chalf"><span class="chip '+cb+'">'+b+'</span><span class="ctcenter">'+plainName[GATE_CENTER[String(b)]]+'</span></div>'
      +'<div class="cstatus '+stCls+'">'+stTxt+'</div></div>';
  });
  host.innerHTML=rows;
}
function update(){
  refreshBodies();
  buildTable();
  let g=0,def=0,half=0;
  for(const k in gateColor){if(gateColor[k]!=='none')g++;}
  ALL_CHANNELS.forEach(([a,b])=>{const st=channelStatus(a,b);if(st==='def')def++;else if(st==='half')half++;});
  document.getElementById('gateCount').textContent=g;
  document.getElementById('defCount').textContent=def;
  document.getElementById('halfCount').textContent=half;
}
function cycleColor(g){
  const cur=gateColor[g]||'none';
  const next=COLOR_ORDER[(COLOR_ORDER.indexOf(cur)+1)%COLOR_ORDER.length];
  if(next==='none')delete gateColor[g];else gateColor[g]=next;
  update();
}
function generateReport(){
  const L=[];
  L.push('【人类图标注报告】');L.push('');
  const v=id=>document.getElementById(id).value;
  const cfg=[['类型',v('cfg-type')],['内在权威',v('cfg-authority')],['人生角色',v('cfg-profile')],['定义',v('cfg-definition')],['策略',v('cfg-strategy')]].filter(x=>x[1]);
  L.push('— 基础配置 —');if(cfg.length)cfg.forEach(c=>L.push(c[0]+'：'+c[1]));else L.push('（未填写）');L.push('');
  const def=[],open=[];
  CENTER_ORDER.forEach(c=>(centerIsDefined(c)?def:open).push(plainName[c]));
  L.push('— 中心定义状态（自动）—');
  L.push('定义中心：'+(def.join('、')||'无'));
  L.push('开放中心：'+(open.join('、')||'无'));L.push('');
  const byColor={red:[],black:[],stripe:[]};
  for(const g in gateColor){if(gateColor[g]!=='none')byColor[gateColor[g]].push(Number(g));}
  ['red','black','stripe'].forEach(c=>byColor[c].sort((a,b)=>a-b));
  L.push('— 点亮闸门及颜色（自动）—');
  let anyGate=false;
  ['red','black','stripe'].forEach(c=>{if(byColor[c].length){anyGate=true;L.push('● '+colorName[c]+'('+(c==='red'?'潜意识':c==='black'?'意识':'双重')+')：'+byColor[c].join(', '));}});
  if(!anyGate)L.push('（无点亮闸门）');L.push('');
  const defCh=[],halfCh=[];
  ALL_CHANNELS.forEach(([a,b,cn])=>{
    const st=channelStatus(a,b);if(st==='none')return;
    const c=channelColor(a,b);
    const line=a+'-'+b+' '+cn+'通道：'+a+'端='+colorName[c.a]+' ‖ '+b+'端='+colorName[c.b];
    (st==='def'?defCh:halfCh).push(line);
  });
  L.push('— 定义通道（两端都有色，共'+defCh.length+'条）—');
  if(defCh.length)defCh.forEach(x=>L.push(x));else L.push('（无）');L.push('');
  L.push('— 半通道（仅一端有色，共'+halfCh.length+'条）—');
  if(halfCh.length)halfCh.forEach(x=>L.push(x));else L.push('（无）');L.push('');
  L.push('— 提示 —');
  L.push('· 两端都有色 = 定义中心中的定义通道');
  L.push('· 一端有色 = 半通道（对岸闸门待补）');
  L.push('· 红=潜意识，黑=意识，条纹=红黑双重');
  document.getElementById('report').textContent=L.join('\n');
  toast('报告已生成');
  document.getElementById('report').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function downloadReport(){const el=document.getElementById('report');if(!el.textContent)generateReport();const b=new Blob([el.textContent],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='人类图标注_'+new Date().toISOString().slice(0,10)+'.txt';a.click();URL.revokeObjectURL(a.href);}
function copyReport(){const el=document.getElementById('report');if(!el.textContent)generateReport();navigator.clipboard.writeText(el.textContent).then(()=>toast('已复制')).catch(()=>toast('复制失败，请手动复制'));}
function resetAll(){if(!confirm('清空所有标注？'))return;for(const k in gateColor)delete gateColor[k];update();document.getElementById('report').textContent='';toast('已清空');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
(function(){buildBody();document.getElementById('bodygraph').addEventListener('click',e=>{const g=e.target.closest('.gate');if(g)cycleColor(g.dataset.gate);});update();})();
</script>
</body>
</html>
